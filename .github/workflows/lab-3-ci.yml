name: Lab 3 CI

# Runs on every commit pushed to any branch, and on pull requests to main,
# but only when lab-3 (or this workflow) actually changed.
on:
  push:
    paths:
      - 'trimester-5/devops/lab-3/**'
      - '.github/workflows/lab-3-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trimester-5/devops/lab-3/**'
      - '.github/workflows/lab-3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch when new commits arrive.
concurrency:
  group: lab-3-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: trimester-5/devops/lab-3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lab-3-dist
          path: trimester-5/devops/lab-3/dist
          retention-days: 7
